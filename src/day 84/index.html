<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Day 84 - Edge Cases</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>My Task List</h1>

        <p id="status">Add your first task.</p>

        <div class="input-area">
            <input
                type="text"
                id="taskInput"
                placeholder="Enter a task..."
            >

            <button id="addButton">
                Add Task
            </button>
        </div>

        <p id="error"></p>

        <ul id="taskList"></ul>

    </div>

    <script src="script.js"></script>

</body>
</html>
